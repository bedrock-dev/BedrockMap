buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        //noinspection AndroidGradlePluginVersion
        classpath 'com.android.tools.build:gradle:9.0.0'
    }
}

repositories {
    google()
    mavenCentral()
    maven {
        url = uri('https://jitpack.io')
        content { includeGroup 'com.github.topjohnwu.libsu' }
    }
}

apply plugin: qtGradlePluginType

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    //noinspection GradleDependency
    implementation 'androidx.core:core:1.17.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'
    implementation 'com.github.topjohnwu.libsu:service:6.0.0'
}

// Use the same local key for every build type.
def signingStorePath = System.getenv('BEDROCKMAP_KEYSTORE_PATH')
def signingCredentialsPath = System.getenv('BEDROCKMAP_KEYSTORE_CREDENTIALS')
if (!signingStorePath || !signingCredentialsPath) {
    throw new GradleException('Set BEDROCKMAP_KEYSTORE_PATH and BEDROCKMAP_KEYSTORE_CREDENTIALS.')
}
def signingValues = new Properties()
file(signingCredentialsPath).withReader('UTF-8') { signingValues.load(it) }
if (!signingValues.getProperty('storePassword') || !signingValues.getProperty('keyPassword')) {
    throw new GradleException('Keystore credentials are incomplete.')
}

android {
    buildFeatures { aidl = true }
    namespace = androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion = androidNdkVersion
    if (project.hasProperty('bedrockmapNdkPath')) {
        ndkPath = project.property('bedrockmapNdkPath')
    }

    signingConfigs {
        bedrockmap {
            storeFile = file(signingStorePath)
            storePassword = signingValues.getProperty('storePassword')
            keyAlias = System.getenv('BEDROCKMAP_KEYSTORE_ALIAS') ?: 'bedrockmap'
            keyPassword = signingValues.getProperty('keyPassword')
        }
    }
    buildTypes.configureEach { signingConfig = signingConfigs.bedrockmap }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            kotlin.srcDirs = [qtAndroidDir + '/src', 'src', 'kotlin']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
       }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
        options.compilerArgs += ['-Xlint:all']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Avoid lint-only dependency downloads during packaging.
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    aaptOptions {
        // Do not compress Qt binary resources file
        noCompress 'rcc'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = legacyPackaging.toBoolean()
        }
    }

    defaultConfig {
        resConfig "en"
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
        ndk.abiFilters = qtTargetAbiList.split(",")
    }
}

// AGP also creates lintVital tasks outside the lint setting.
tasks.configureEach {
    if (name.startsWith('lintVital')) {
        enabled = false
    }
}
