[Gui]
# Application theme
# Available options: light, dark, system
theme=light

# Custom font family (leave empty for system default)
font_family=

# Custom font size in points (set to -1 for system default)
font_size=-1

# Launch in pure NBT editor mode
# When enabled, opens NBT editor directly on startup
nbt_editor_mode=false


[Map]
# Shadow rendering style
# 0: No shadows (fastest performance)
# 1: Basic shadows (balanced performance/quality)
# 2: Advanced light-model-based shadows (experimental, best quality)
render_style=1

# Terrain shadow intensity (0-255)
# Higher values produce darker shadows
terrian_shadow_level=150

# Minimum zoom scale level
# Lower values allow zooming out further
min_scale_level=4

# Maximum zoom scale level
# Higher values allow zooming in closer
max_scale_level=1024

# Zoom sensitivity multiplier
# Values > 1.0 increase zoom speed, < 1.0 decrease it
zoom_speed=1.2

# Grid line color (hex format: #RRGGBB)
grid_line_color=#bbbbbb

# Actor (entity/player) rendering style
# 0: Individual icons for each actor (more detailed)
# 1: Consolidated icons per chunk (better performance for crowded areas)
actor_render_style=0

# Actor border width in pixels (0 = no border)
actor_border_width=2

# Actor border color (hex format: #RRGGBB)
actor_border_color=#000000

# Void/empty area background color (hex format: #RRGGBB)
void_color=#dddddd

# Render block under water
transparent_water = true


# Enable thumbnail mode
enable_thumbnail_mode=false


[Cache]
# Maximum number of non-empty regions to keep in memory
# Larger values improve performance but use more RAM
region_cache_size=4096

# Maximum number of empty regions to keep in memory
empty_cache_size=16384

# Maximum number of concurrent threads for background operations
# Set to 0 for automatic detection based on CPU cores
max_thread_num=8

[Misc]
# Load global world data (players, villages, maps, etc.)
load_global_data=true


[Debug]
# log message to console/log if missing block/actor color or texture
log_out_missng_texture=false